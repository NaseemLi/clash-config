mixed-port: 7890
allow-lan: true
# 运行模式: Rule (规则模式), Global (全局模式), Direct (直连模式)
mode: Rule
bind-address: "*"
ipv6: false
unified-delay: true
# 是否启用 TCP 并发
tcp-concurrent: true
# 日志级别: info, warning, error, debug, silent
log-level: info
global-client-fingerprint: chrome
# 保持连接空闲时间 (秒)
keep-alive-idle: 600
# 保持连接间隔时间 (秒)
keep-alive-interval: 15

# 面板
#external-controller: 0.0.0.0:9090
#secret: ""
#external-ui: ui
#external-ui-name: zashboard
#external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 配置文件设置
profile:
  # 存储选择的节点
  store-selected: true
  # 存储伪造的 IP 地址
  store-fake-ip: true

tun:
  enable: true
  # system/gvisor/mixed
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true
  mtu: 1500
  device: Mihomo

dns:
  enable: true
  cache-algorithm: arc
  #裸核面板监听地址 0.0.0.0:1053
  listen: 127.0.0.1:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - https://223.5.5.5/dns-query
    - https://119.29.29.29/dns-query
  proxy-server-nameserver:
    - https://8.8.8.8/dns-query
    - https://1.1.1.1/dns-query
  direct-nameserver:
    - https://223.5.5.5/dns-query
  nameserver:
    - https://8.8.8.8/dns-query#RULES&ecs=223.5.5.0/24
  fake-ip-filter:
    - "rule-set:fakeipfilter_domain"

# 代理节点
proxies:
  - name: 直连
    type: direct

  - name: 拒绝
    type: reject

  - name: Proxy1

  - name: Proxy2

# 代理提供者 (订阅源)
# proxy-providers:
#   all-proxies:
#     type: http
#     url: "https://example.com/your-subscription-url"
#     interval: 3600
