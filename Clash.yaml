# ============================================================
# Mihomo 配置模板
# ============================================================

# ============================================================
# 基础配置
# ============================================================

mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: Rule
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
global-client-fingerprint: chrome
# 保持连接空闲时间，单位：秒
keep-alive-idle: 600
# 保持连接探测间隔，单位：秒
keep-alive-interval: 15

# ============================================================
# 配置文件状态
# ============================================================

profile:
  # 记住策略组选择
  store-selected: true
  # 记住 fake-ip 映射
  store-fake-ip: true

# ============================================================
# TUN 配置
# ============================================================

tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true
  mtu: 1500
  device: Mihomo

# ============================================================
# DNS 配置
# ============================================================

dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  respect-rules: true
  use-hosts: true
  cache-algorithm: arc
  cache-size: 4096
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost"
    - "localhost.*"
    - "time.*.com"
    - "time.*.gov"
    - "pool.ntp.org"
    - "rule-set:fakeipfilter_domain"
  # 用于解析 DNS 服务器自身域名
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 直连域名使用的 DNS
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  # 代理节点域名使用的 DNS
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  # 国内域名国内解析，国外域名使用代理 DNS
  nameserver-policy:
    "geosite:cn,private":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
    "geosite:geolocation-!cn":
      - https://1.1.1.1/dns-query#🧭 DNS 出口
      - https://8.8.8.8/dns-query#🧭 DNS 出口
  # 默认 DNS，主要处理非国内域名
  nameserver:
    - https://1.1.1.1/dns-query#🧭 DNS 出口
    - https://8.8.8.8/dns-query#🧭 DNS 出口

# ============================================================
# 静态代理节点
# ============================================================

proxies:
  - name: 直连
    type: direct

  - name: 拒绝
    type: reject

  - name: AAA-Reality
    type: vless
    server: example.com
    port: 443
    uuid: 00000000-0000-0000-0000-000000000000
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: www.example.com
    client-fingerprint: chrome
    reality-opts:
      public-key: YOUR_PUBLIC_KEY
      short-id: YOUR_SHORT_ID

  - name: BBB-Reality
    type: vless
    server: example.net
    port: 443
    uuid: 00000000-0000-0000-0000-000000000000
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: www.example.net
    client-fingerprint: chrome
    reality-opts:
      public-key: YOUR_PUBLIC_KEY
      short-id: YOUR_SHORT_ID

# ============================================================
# 远程订阅
# ============================================================

proxy-providers:
  CCC:
    type: http
    url: "https://example.com/subscription"
    interval: 3600
    path: ./providers/CCC.yaml
    proxy: DIRECT
    override:
      udp: true
    health-check:
      enable: true
      interval: 600
      url: https://cp.cloudflare.com/generate_204

# ============================================================
# 策略组
# ============================================================

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ⚡ 自动选择
      - AAA-Reality
      - BBB-Reality
      - 🌍 自选地区
      - 直连
      - 拒绝

  - name: ⚡ 自动选择
    type: url-test
    proxies:
      - AAA-Reality
      - BBB-Reality
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 80
    lazy: true

  - name: 🌍 自选地区
    type: select
    use:
      - CCC

  - name: 🧭 DNS 出口
